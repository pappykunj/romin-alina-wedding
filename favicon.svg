<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Crisp Rounded White Background with subtle gold border for perfect contrast in both dark and light browser tabs -->
  <rect width="128" height="128" rx="28" fill="#FFFFFF"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#C59B27" stroke-width="3" stroke-opacity="0.6"/>

  <style>
    .serif-text {
      font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
      font-weight: 700;
      fill: #2A3F5B;
    }
    .cursive-amp {
      font-family: 'Alex Brush', 'Great Vibes', 'Brush Script MT', cursive;
      font-weight: 400;
      fill: #C59B27;
    }
  </style>
  
  <text x="32" y="82" class="serif-text" font-size="62" text-anchor="middle">R</text>
  <text x="64" y="74" class="cursive-amp" font-size="52" text-anchor="middle">&amp;</text>
  <text x="96" y="82" class="serif-text" font-size="62" text-anchor="middle">A</text>
</svg>
